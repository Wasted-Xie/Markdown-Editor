[package]
name = "markdown-editor"
version = "0.1.2"
description = "Markdown 桌面编辑器"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "markdown_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
# 仅 Linux 剪贴板实现需要：把文件路径编码成 file:// URI
percent-encoding = "2"

[profile.dev]
incremental = true

# 说明：这里刻意不设置 panic = "abort"。
# 部分 Tauri 特性组合在该设置下会出现链接期错误，
# 若确认可用再手动加回来以进一步压缩体积。
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
